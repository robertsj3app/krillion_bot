[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krillion_bot"
version = "1.1.1"
description = "Discord bot to manage Krillion results for a server"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    'discord.py',
    'aiosqlite',
    'python-dotenv',
    'tzdata'
]

[project.optional-dependencies]
dev = [
    'pytest',
    'pytest-asyncio',
    'pytest-cov',
    'pdoc'
]

[tool.setuptools.packages.find]
where = ["src"]  # Specifies that code is inside a 'src' directory
include = ["krillion_bot*"]

[tool.setuptools.package-data]
krillion_bot = ["data/*.json"]
